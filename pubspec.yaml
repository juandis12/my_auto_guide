name: my_auto_guide
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.10.0
  local_auth: ^2.3.0
  google_generative_ai: ^0.4.5
  google_mlkit_text_recognition: ^0.14.0

  # UI
  dotted_border: ^3.1.0
  photo_view: ^0.14.0
  google_fonts: ^6.2.1
  flutter_markdown: ^0.7.3+1

  # Web / contenido
  url_launcher: ^6.2.5
  youtube_player_iframe: ^4.0.4
  webview_flutter: ^4.9.0

  # Archivos
  file_picker: ^8.0.0
  open_filex: ^4.0.0
  path_provider: ^2.1.5

  # Red y Correos
  http: ^1.5.0
  mailer: ^6.1.0

  # Permisos
  permission_handler: ^12.0.1
  device_info_plus: ^11.5.0

  # Notificaciones
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4
  connectivity_plus: ^6.0.0

  # Imágenes
  image_picker: ^1.1.0
  vision_gallery_saver: ^3.0.0
  camera: ^0.11.0
  sensors_plus: ^6.1.1

  # Almacenamiento local
  shared_preferences: ^2.3.2

  # State management
  provider: ^6.0.5

  # Offline / DB local
  sqflite: ^2.3.0
  path: ^1.8.3

  # Analytics y monitoreo
  sentry_flutter: ^9.0.0

  # Compresión de imágenes
  image: ^4.1.3

  # Internacionalización
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # PDF
  syncfusion_flutter_pdfviewer: ^31.1.18
  pdf: ^3.12.0
  printing: ^5.14.3

  # Mapas y rutas
  flutter_map: ^6.1.0
  latlong2: ^0.9.1
  geolocator: ^13.0.2

  # Seguridad y Configuración
  flutter_dotenv: ^5.1.0
  flutter_secure_storage: ^9.2.2  # VULN-01: Almacenamiento cifrado (Android Keystore / iOS Keychain)
  crypto: ^3.0.6                  # VULN-05: Hashing SHA-256 para cédula

  # Fondo y Widgets
  flutter_background_service: ^5.0.10
  home_widget: ^0.7.0
  firebase_core: ^4.5.0
  firebase_messaging: ^16.1.2
  realtime_client: ^2.7.0
  share_plus: ^12.0.2
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.7
  flutter_launcher_icons: ^0.14.4
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  generate: true

  config:
    enable-swift-package-manager: false

  assets:
    - .env
    - assets/data/
    - assets/360_guide/car/
    - assets/360_guide/moto/
    - assets/car.png
    - assets/APK.png
    - assets/google.png
    - assets/facebook.png
    - assets/apple.png
    - assets/bg_pattern.png
    - assets/bus.png
    - assets/furgon.png
    - assets/lineasfondo.png
    - assets/logos/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/APK.png