<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gastosBgGrad" x1="0" y1="0" x2="390" y2="844" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>

    <linearGradient id="tanqueoHeroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064E3B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="btnTanqueoGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" rx="44" fill="url(#gastosBgGrad)"/>

  <!-- Status Bar -->
  <text x="36" y="34" fill="#F8FAFC" font-family="'Outfit', -apple-system, sans-serif" font-size="14" font-weight="700">9:45</text>
  <path d="M328 24C328 22.8954 328.895 22 330 22H348C349.105 22 350 22.8954 350 24V32C350 33.1046 349.105 34 348 34H330C328.895 34 328 33.1046 328 32V24Z" stroke="#94A3B8" stroke-width="2"/>
  <rect x="331" y="25" width="13" height="6" rx="1.5" fill="#34D399"/>

  <!-- Top App Bar -->
  <rect x="20" y="52" width="350" height="46" fill="transparent"/>
  <rect x="20" y="56" width="38" height="38" rx="19" fill="#1E293B" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="32" y="80" fill="#FFFFFF" font-size="16">←</text>

  <text x="68" y="81" fill="#FFFFFF" font-family="'Outfit', -apple-system, sans-serif" font-size="18" font-weight="800">Bitácora &amp; Rendimiento</text>

  <!-- Add Fuel Button -->
  <rect x="256" y="56" width="114" height="38" rx="19" fill="url(#btnTanqueoGrad)"/>
  <text x="313" y="80" text-anchor="middle" fill="#FFFFFF" font-family="'Outfit', -apple-system, sans-serif" font-size="12" font-weight="800">+ Tanqueo</text>

  <!-- Main Efficiency Hero Card -->
  <rect x="20" y="106" width="350" height="136" rx="24" fill="url(#tanqueoHeroGrad)" stroke="rgba(52,211,153,0.3)" stroke-width="1.2"/>
  
  <text x="36" y="134" fill="#6EE7B7" font-family="'Outfit', -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">RENDIMIENTO PROMEDIO CALCULADO</text>
  <text x="36" y="174" fill="#FFFFFF" font-family="'Outfit', -apple-system, sans-serif" font-size="32" font-weight="800">42.5 <tspan font-size="16" fill="#34D399" font-weight="700">km/gal</tspan></text>
  <text x="36" y="196" fill="#A7F3D0" font-family="'Outfit', -apple-system, sans-serif" font-size="11">Costo por KM: <tspan font-weight="700" fill="#FFFFFF">$350 COP/km</tspan> • <tspan fill="#34D399">+4.1% eficiencia</tspan></text>

  <!-- Total Spend Indicator Inside Card -->
  <line x1="36" y1="210" x2="354" y2="210" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="36" y="228" fill="#CBD5E1" font-family="'Outfit', -apple-system, sans-serif" font-size="11">Gasto total combustible (Septiembre):</text>
  <text x="354" y="228" text-anchor="end" fill="#FDE047" font-family="'Outfit', -apple-system, sans-serif" font-size="12" font-weight="800">$ 342.500 COP</text>

  <!-- Expense Breakdown Mini Visualizer -->
  <rect x="20" y="254" width="350" height="76" rx="18" fill="#1E293B" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="36" y="276" fill="#94A3B8" font-family="'Outfit', -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1">DISTRIBUCIÓN DE GASTOS</text>
  
  <rect x="36" y="286" width="318" height="8" rx="4" fill="#334155"/>
  <rect x="36" y="286" width="190" height="8" rx="4" fill="#10B981"/> <!-- Gasolina -->
  <rect x="230" y="286" width="76" height="8" rx="4" fill="#3B82F6"/> <!-- Taller -->
  <rect x="310" y="286" width="44" height="8" rx="4" fill="#F59E0B"/> <!-- Peajes -->

  <text x="36" y="316" fill="#34D399" font-family="'Outfit', -apple-system, sans-serif" font-size="10" font-weight="600">● Gasolina (60%)</text>
  <text x="150" y="316" fill="#60A5FA" font-family="'Outfit', -apple-system, sans-serif" font-size="10" font-weight="600">● Taller (24%)</text>
  <text x="255" y="316" fill="#FDE047" font-family="'Outfit', -apple-system, sans-serif" font-size="10" font-weight="600">● Peajes (16%)</text>

  <!-- Records History Section -->
  <text x="24" y="354" fill="#94A3B8" font-family="'Outfit', -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">HISTORIAL DE TANQUEOS &amp; GASTOS</text>

  <!-- Item 1: Tanqueo -->
  <rect x="20" y="366" width="350" height="78" rx="18" fill="#1E293B" stroke="rgba(52,211,153,0.2)" stroke-width="1"/>
  <circle cx="48" cy="405" r="18" fill="#064E3B"/>
  <text x="42" y="410" font-size="14">⛽</text>
  <text x="78" y="396" fill="#FFFFFF" font-family="'Outfit', -apple-system, sans-serif" font-size="14" font-weight="800">Tanqueo Gasolina Corriente</text>
  <text x="78" y="416" fill="#94A3B8" font-family="'Outfit', -apple-system, sans-serif" font-size="11">8.5 gal • 48.250 km • Terpel Cl. 170</text>
  <text x="354" y="396" text-anchor="end" fill="#FFFFFF" font-family="'Outfit', -apple-system, sans-serif" font-size="14" font-weight="800">$ 145.000</text>
  <text x="354" y="416" text-anchor="end" fill="#34D399" font-family="'Outfit', -apple-system, sans-serif" font-size="11" font-weight="600">08 Sep</text>

  <!-- Item 2: Peaje -->
  <rect x="20" y="454" width="350" height="78" rx="18" fill="#1E293B" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="48" cy="493" r="18" fill="#78350F"/>
  <text x="42" y="498" font-size="14">🎟️</text>
  <text x="78" y="484" fill="#FFFFFF" font-family="'Outfit', -apple-system, sans-serif" font-size="14" font-weight="800">Peaje Andes Norte</text>
  <text x="78" y="504" fill="#94A3B8" font-family="'Outfit', -apple-system, sans-serif" font-size="11">Ruta Bogotá - Chía • Odómetro 48.110 km</text>
  <text x="354" y="484" text-anchor="end" fill="#FFFFFF" font-family="'Outfit', -apple-system, sans-serif" font-size="14" font-weight="800">$ 11.200</text>
  <text x="354" y="504" text-anchor="end" fill="#64748B" font-family="'Outfit', -apple-system, sans-serif" font-size="11">05 Sep</text>

  <!-- Item 3: Mantenimiento Taller -->
  <rect x="20" y="542" width="350" height="78" rx="18" fill="#1E293B" stroke="rgba(56,189,248,0.2)" stroke-width="1"/>
  <circle cx="48" cy="581" r="18" fill="#1E3A8A"/>
  <text x="42" y="586" font-size="14">🔧</text>
  <text x="78" y="572" fill="#FFFFFF" font-family="'Outfit', -apple-system, sans-serif" font-size="14" font-weight="800">Cambio Pastillas Frenos</text>
  <text x="78" y="592" fill="#94A3B8" font-family="'Outfit', -apple-system, sans-serif" font-size="11">Taller Los Andes • 45.000 km</text>
  <text x="354" y="572" text-anchor="end" fill="#FFFFFF" font-family="'Outfit', -apple-system, sans-serif" font-size="14" font-weight="800">$ 186.300</text>
  <text x="354" y="592" text-anchor="end" fill="#64748B" font-family="'Outfit', -apple-system, sans-serif" font-size="11">28 Ago</text>

  <!-- Export PDF Action Button -->
  <rect x="20" y="632" width="350" height="48" rx="16" fill="#1E293B" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
  <text x="195" y="662" text-anchor="middle" fill="#38BDF8" font-family="'Outfit', -apple-system, sans-serif" font-size="12" font-weight="700">📄 Exportar Hoja de Vida &amp; Gastos en PDF</text>

  <!-- Bottom Home Indicator -->
  <rect x="130" y="830" width="130" height="4" rx="2" fill="#475569"/>
</svg>
