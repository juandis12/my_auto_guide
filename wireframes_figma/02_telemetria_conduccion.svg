<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="navBgGrad" x1="0" y1="0" x2="390" y2="844" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#080C14"/>
    </linearGradient>

    <linearGradient id="hudGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="hudGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284C7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" rx="44" fill="url(#navBgGrad)"/>

  <!-- Simulated Map GPS Canvas -->
  <rect x="16" y="50" width="358" height="420" rx="28" fill="#0E1626" stroke="rgba(56,189,248,0.2)" stroke-width="1.2"/>
  
  <!-- Map Roads Grid Simulation -->
  <path d="M40 80 C 120 160, 180 120, 340 200" stroke="#1E293B" stroke-width="24" stroke-linecap="round"/>
  <path d="M60 440 C 120 340, 200 370, 330 260" stroke="#1E293B" stroke-width="28" stroke-linecap="round"/>
  
  <!-- Active Route (Electric Cyan Gradient Path) -->
  <path d="M60 440 C 120 340, 200 370, 330 260" stroke="#38BDF8" stroke-width="10" stroke-linecap="round"/>
  <path d="M60 440 C 120 340, 200 370, 330 260" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8"/>

  <!-- Caravan Members Markers -->
  <circle cx="140" cy="355" r="14" fill="#10B981" stroke="#FFFFFF" stroke-width="2"/>
  <text x="134" y="360" fill="#FFFFFF" font-size="11">🏍️</text>

  <circle cx="210" cy="370" r="14" fill="#F59E0B" stroke="#FFFFFF" stroke-width="2"/>
  <text x="204" y="375" fill="#FFFFFF" font-size="11">🚗</text>

  <!-- User Active Pulse Marker -->
  <circle cx="280" cy="310" r="24" fill="#38BDF8" fill-opacity="0.25"/>
  <circle cx="280" cy="310" r="14" fill="#0284C7" stroke="#FFFFFF" stroke-width="3"/>

  <!-- Top Floating Controls: End Trip & Caravan Status -->
  <rect x="28" y="66" width="136" height="38" rx="19" fill="#1E293B" fill-opacity="0.9" stroke="rgba(239,68,68,0.4)" stroke-width="1"/>
  <text x="44" y="90" fill="#EF4444" font-family="'Outfit', -apple-system, sans-serif" font-size="12" font-weight="700">✕ Finalizar Ruta</text>

  <rect x="232" y="66" width="130" height="38" rx="19" fill="#064E3B" fill-opacity="0.9" stroke="rgba(52,211,153,0.5)" stroke-width="1"/>
  <circle cx="248" cy="85" r="5" fill="#34D399"/>
  <text x="260" y="90" fill="#D1FAE5" font-family="'Outfit', -apple-system, sans-serif" font-size="12" font-weight="700">Caravana (3)</text>

  <!-- Next Turn Floating Direction Card -->
  <rect x="28" y="116" width="334" height="64" rx="18" fill="#0F172A" fill-opacity="0.95" stroke="rgba(56,189,248,0.3)" stroke-width="1"/>
  <rect x="42" y="128" width="40" height="40" rx="12" fill="#2563EB"/>
  <path d="M62 138V158M62 138L52 148M62 138L72 148" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="94" y="146" fill="#FFFFFF" font-family="'Outfit', -apple-system, sans-serif" font-size="14" font-weight="700">En 350 m, gire a la derecha</text>
  <text x="94" y="164" fill="#94A3B8" font-family="'Outfit', -apple-system, sans-serif" font-size="11">Hacia Autopista Norte • Cra 45</text>

  <!-- HUD Telemetry Dashboard Box -->
  <rect x="16" y="484" width="358" height="236" rx="26" fill="url(#hudGlass)" stroke="rgba(56,189,248,0.25)" stroke-width="1.2" filter="url(#hudGlow)"/>

  <!-- Speedometer & Limit Circle -->
  <text x="195" y="516" text-anchor="middle" fill="#94A3B8" font-family="'Outfit', -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">VELOCIDAD GPS</text>
  
  <text x="195" y="582" text-anchor="middle" fill="#F8FAFC" font-family="'Outfit', -apple-system, sans-serif" font-size="68" font-weight="800" letter-spacing="-2">74</text>
  <text x="264" y="556" fill="#38BDF8" font-family="'Outfit', -apple-system, sans-serif" font-size="16" font-weight="700">KM/H</text>

  <!-- Speed Limit Badge -->
  <rect x="36" y="542" width="46" height="46" rx="23" fill="#FEF2F2" stroke="#EF4444" stroke-width="3"/>
  <text x="59" y="570" text-anchor="middle" fill="#0F172A" font-family="'Outfit', -apple-system, sans-serif" font-size="14" font-weight="800">80</text>

  <!-- Radar Status Indicator -->
  <rect x="290" y="542" width="68" height="30" rx="15" fill="#065F46"/>
  <text x="324" y="562" text-anchor="middle" fill="#34D399" font-family="'Outfit', -apple-system, sans-serif" font-size="10" font-weight="700">● Radar OK</text>

  <line x1="36" y1="604" x2="354" y2="604" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <!-- 3 Key Realtime Metrics (Distance, Trip Time, Altitude/Consumption) -->
  <text x="75" y="630" text-anchor="middle" fill="#94A3B8" font-family="'Outfit', -apple-system, sans-serif" font-size="11">Distancia</text>
  <text x="75" y="656" text-anchor="middle" fill="#FFFFFF" font-family="'Outfit', -apple-system, sans-serif" font-size="17" font-weight="800">18.4 <tspan font-size="11" fill="#94A3B8">KM</tspan></text>

  <line x1="135" y1="620" x2="135" y2="665" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <text x="195" y="630" text-anchor="middle" fill="#94A3B8" font-family="'Outfit', -apple-system, sans-serif" font-size="11">Tiempo Viaje</text>
  <text x="195" y="656" text-anchor="middle" fill="#38BDF8" font-family="'Outfit', -apple-system, sans-serif" font-size="17" font-weight="800">00:24:18</text>

  <line x1="255" y1="620" x2="255" y2="665" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

  <text x="315" y="630" text-anchor="middle" fill="#94A3B8" font-family="'Outfit', -apple-system, sans-serif" font-size="11">Consumo Est.</text>
  <text x="315" y="656" text-anchor="middle" fill="#34D399" font-family="'Outfit', -apple-system, sans-serif" font-size="17" font-weight="800">1.4 <tspan font-size="11" fill="#94A3B8">Gal</tspan></text>

  <!-- Emergency Assistance Action Button -->
  <rect x="16" y="734" width="358" height="52" rx="18" fill="#DC2626"/>
  <text x="195" y="766" text-anchor="middle" fill="#FFFFFF" font-family="'Outfit', -apple-system, sans-serif" font-size="13" font-weight="800">🚨 Asistencia Vial &amp; Protocolo Accidente</text>

  <!-- Home Indicator -->
  <rect x="130" y="830" width="130" height="4" rx="2" fill="#475569"/>
</svg>
