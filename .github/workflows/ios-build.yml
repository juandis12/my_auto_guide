name: iOS Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      configuration:
        description: 'Build Configuration (Release for production, Debug for development)'
        required: true
        type: choice
        default: 'Release'
        options:
          - Release
          - Debug
      build_id:
        description: 'Unique build identifier'
        required: false
        type: string
        default: '1'

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.18.0
        with:
          channel: 'stable'

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Install CocoaPods Dependencies
        run: |
          cd ios
          pod install --repo-update

      - name: Build Flutter iOS App (Unsigned)
        env:
          CONFIGURATION: ${{ inputs.configuration || 'Release' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          # Create .env file
          echo "Creando archivo .env..."
          if [ -n "$SUPABASE_URL" ]; then
            echo "SUPABASE_URL=$SUPABASE_URL" > .env
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env
            if [ -n "$GEMINI_API_KEY" ]; then
              echo "GEMINI_API_KEY=$GEMINI_API_KEY" >> .env
            fi
            echo "Secretos configurados correctamente."
          elif [ -f .env.example ]; then
            echo "Usando .env.example como fallback..."
            cp .env.example .env
          else
            touch .env
          fi

          if [ "$CONFIGURATION" = "Debug" ]; then
            echo "Compilando iOS App en Modo Debug..."
            flutter build ios --debug --no-codesign
          else
            echo "Compilando iOS App en Modo Release..."
            flutter build ios --release --no-codesign
          fi

      - name: Create IPA Package
        env:
          BUILD_ID: ${{ inputs.build_id || github.run_number }}
        run: |
          set -e
          APP_PATH=$(find build/ios/iphoneos -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find build/ios/Runner.app -type d 2>/dev/null | head -1)
          fi
          if [ -z "$APP_PATH" ]; then
            echo "Error: .app bundle no encontrado"
            exit 1
          fi
          echo "App bundle encontrado en: $APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -rq "my_auto_guide_$BUILD_ID.ipa" Payload
          rm -rf Payload
          echo "IPA creado exitosamente: build/my_auto_guide_$BUILD_ID.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4.6.1
        with:
          name: 'ios-ipa'
          path: 'build/*.ipa'
          retention-days: 7
          if-no-files-found: 'error'
